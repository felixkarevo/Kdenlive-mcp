name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run docs:check
      - run: bun run sbom --output artifacts/release/sbom
      - run: bun run licenses:report --output artifacts/release/licenses
      - run: bun run package:release --platform ${{ matrix.platform }} --output artifacts/release
      - uses: sigstore/cosign-installer@v3
      - shell: bash
        run: |
          set -euo pipefail
          for file in artifacts/release/*.zip artifacts/release/*.tar.gz artifacts/release/sbom/*.json; do
            [ -f "$file" ] || continue
            cosign sign-blob --yes "$file" --bundle "${file}.sigstore.json"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
      - name: Upload platform release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
            artifacts/release/*.sha256
            artifacts/release/*.sigstore.json
      - name: Upload shared release metadata
        if: matrix.platform == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/sbom/*.json
            artifacts/release/sbom/*.sigstore.json
            artifacts/release/licenses/*
