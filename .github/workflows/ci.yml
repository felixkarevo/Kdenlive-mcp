name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run docs:check
      - if: matrix.os == 'ubuntu-latest'
        run: bun run sbom

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e "apps/analysis-worker[dev]"
      - run: python -m ruff check apps/analysis-worker
      - run: python -m mypy apps/analysis-worker/src
      - run: python -m pytest apps/analysis-worker

  render-smoke-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg melt xvfb xauth
      - run: bun install --frozen-lockfile
      - run: bun run capabilities --output artifacts/capabilities-linux.json
      - run: bun run fixtures:milestone-1 --require-runtime
      - run: bun run test:runtime
      - run: bun run spike:prepare
      - run: bun run spike:render
      - run: bun run render:acceptance
      - run: bun run mcp:acceptance
      - run: bun run sample:milestone-6
      - run: timeout --foreground 30s melt artifacts/milestone-6-sample/Kdenlive-MCP-Milestone-6.kdenlive -consumer xml:artifacts/milestone-6-sample/validated.mlt
      - run: bun run package:release --platform linux
      - shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          bun run release:verify --path "artifacts/release/kdenlive-mcp-${version}-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: render-smoke-linux
          path: artifacts/

  render-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - shell: pwsh
        run: |
          choco install kdenlive --no-progress -y
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
      - run: bun install --frozen-lockfile
      - shell: pwsh
        run: |
          $melt = Get-ChildItem "C:\Program Files\kdenlive" -Recurse -Filter melt.exe | Select-Object -First 1
          if (-not $melt) { throw "melt.exe not found in Kdenlive installation" }
          "MELT_PATH=$($melt.FullName)" >> $env:GITHUB_ENV
      - run: bun run capabilities --output artifacts/capabilities-windows.json
      - run: bun run fixtures:milestone-1 --require-runtime
      - run: bun run test:runtime
      - run: bun run spike:prepare
      - run: bun run spike:render
      - run: bun run render:acceptance
      - run: bun run mcp:acceptance
      - run: bun run sample:milestone-6
      - shell: pwsh
        run: '& $env:MELT_PATH artifacts\milestone-6-sample\Kdenlive-MCP-Milestone-6.kdenlive -consumer null'
      - run: bun run package:release --platform windows
      - shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          bun run release:verify --path "artifacts/release/kdenlive-mcp-$version-windows-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: render-smoke-windows
          path: artifacts/
